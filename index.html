<title>知识地下城 · 答题闯关</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background:
      radial-gradient(circle at 20% 10%, rgba(132, 204, 22, 0.18), transparent 35%),
      radial-gradient(circle at 80% 90%, rgba(220, 38, 38, 0.12), transparent 35%),
      #07110c;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eaffdf;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .game {
    width: 100%;
    max-width: 470px;
    padding: 18px;
    border-radius: 26px;
    background: rgba(12, 32, 22, 0.92);
    border: 1px solid rgba(132, 204, 22, 0.22);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    position: relative;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title {
    font-size: 21px;
    font-weight: 900;
    color: #b8ff7a;
    letter-spacing: 0.5px;
  }

  .floor-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .floor {
    font-size: 13px;
    color: #ffd966;
    background: rgba(255, 217, 102, 0.08);
    border: 1px solid rgba(255, 217, 102, 0.22);
    padding: 6px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  #muteBtn {
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid rgba(255, 217, 102, 0.22);
    border-radius: 999px;
    background: rgba(255, 217, 102, 0.08);
    color: #ffd966;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
    transition: transform 0.12s ease;
  }

  #muteBtn:active { transform: scale(0.9); }

  .best {
    margin-top: 8px;
    font-size: 11px;
    color: #6f8f78;
    text-align: right;
  }

  .best b { color: #ffd966; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 12px 0 14px;
  }

  .stat {
    padding: 8px 4px;
    border-radius: 12px;
    text-align: center;
    background: rgba(255, 255, 255, 0.055);
    font-size: 11px;
    color: #9fbfa8;
  }

  .stat b {
    display: block;
    margin-top: 3px;
    font-size: 15px;
    color: #eaffdf;
  }

  .stat b.bump {
    animation: statBump 0.3s ease;
  }

  @keyframes statBump {
    0% { transform: scale(1); color: #b8ff7a; }
    50% { transform: scale(1.35); color: #b8ff7a; }
    100% { transform: scale(1); }
  }

  .player-panel,
  .enemy-panel {
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.055);
    position: relative;
    overflow: hidden;
  }

  .panel-hit {
    animation: panelShake 0.3s ease;
  }

  @keyframes panelShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }

  .panel-hit-crit {
    animation: panelShake 0.3s ease, critFlash 0.4s ease;
  }

  @keyframes critFlash {
    0% { background: rgba(255, 217, 102, 0.28); }
    100% { background: rgba(255, 255, 255, 0.05); }
  }

  .float-num {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: 900;
    color: #ff8f8f;
    pointer-events: none;
    animation: floatUp 0.9s ease forwards;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    z-index: 5;
    white-space: nowrap;
  }

  .float-num.crit {
    font-size: 30px;
    color: #ffd966;
  }

  .float-num.heal {
    color: #7bf29b;
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 12px) scale(0.6); }
    18% { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -46px) scale(1); }
  }

  .bar-label {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
    font-size: 12px;
    color: #9fbfa8;
  }

  .hpbar {
    height: 12px;
    overflow: hidden;
    border-radius: 999px;
    background: #1b2b22;
  }

  .hpfill {
    width: 100%;
    height: 100%;
    border-radius: inherit;
    transition: width 0.25s ease;
  }

  .hpfill.player {
    background: linear-gradient(90deg, #4ade80, #22c55e);
  }

  .hpfill.player.low {
    background: linear-gradient(90deg, #fb923c, #dc2626);
    animation: lowHp 0.8s ease-in-out infinite;
  }

  @keyframes lowHp {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .hpfill.enemy {
    background: linear-gradient(90deg, #f87171, #dc2626);
  }

  .substats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    margin-top: 9px;
    font-size: 12px;
    color: #9fbfa8;
  }

  .substats b { color: #eaffdf; }

  .enemy-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 7px;
    font-size: 15px;
    font-weight: 800;
    color: #ffe3a3;
  }

  .enemy-face {
    font-size: 26px;
    line-height: 1;
    animation: enemyIdle 1.8s ease-in-out infinite;
  }

  .enemy-panel.hurt .enemy-face { animation: enemyHurt 0.35s ease; }

  @keyframes enemyIdle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  @keyframes enemyHurt {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-14deg) scale(1.15); }
    60% { transform: rotate(10deg); }
  }

  .enemy-name-text {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .enemy-title span:last-child {
    font-size: 12px;
    font-weight: 500;
    color: #9fbfa8;
    white-space: nowrap;
  }

  /* ---------- 答题区 ---------- */
  .quiz-card {
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.055);
    transition: border-color 0.2s ease;
  }

  .quiz-card.right { border-color: rgba(74, 222, 128, 0.6); }
  .quiz-card.wrong { border-color: rgba(248, 113, 113, 0.6); }

  .timebar {
    height: 6px;
    border-radius: 999px;
    background: #1b2b22;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .timefill {
    height: 100%;
    width: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #a3e635, #22c55e);
    transition: width 0.1s linear;
  }

  .timefill.urgent {
    background: linear-gradient(90deg, #fb923c, #dc2626);
  }

  .question {
    font-size: 14.5px;
    font-weight: 700;
    line-height: 1.55;
    color: #eaffdf;
    margin-bottom: 12px;
    min-height: 44px;
  }

  .question .qnum {
    display: inline-block;
    margin-right: 6px;
    font-size: 11px;
    font-weight: 900;
    color: #b8ff7a;
    background: rgba(132, 204, 22, 0.12);
    border: 1px solid rgba(132, 204, 22, 0.25);
    padding: 1px 7px;
    border-radius: 6px;
    vertical-align: 1px;
  }

  .question .qnum.mid { color: #7ec8ff; background: rgba(126, 200, 255, 0.1); border-color: rgba(126, 200, 255, 0.3); }
  .question .qnum.hard { color: #ff9f6f; background: rgba(255, 159, 111, 0.1); border-color: rgba(255, 159, 111, 0.3); }

  .options {
    display: grid;
    gap: 8px;
  }

  .opt {
    padding: 11px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: rgba(255, 255, 255, 0.04);
    color: #d7ecd9;
    font-family: inherit;
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
    line-height: 1.45;
    transition: border-color 0.12s ease, background 0.12s ease, transform 0.12s ease;
    touch-action: manipulation;
  }

  .opt:hover:not(:disabled) {
    border-color: rgba(163, 230, 53, 0.5);
    background: rgba(132, 204, 22, 0.08);
  }

  .opt:active:not(:disabled) { transform: scale(0.99); }

  .opt:disabled { cursor: default; opacity: 0.85; }

  .opt .tag {
    display: inline-block;
    margin-right: 8px;
    font-weight: 900;
    color: #9fbfa8;
  }

  .opt.correct {
    border-color: #4ade80;
    background: rgba(74, 222, 128, 0.14);
    color: #d9ffe3;
  }

  .opt.correct .tag { color: #4ade80; }

  .opt.wrong-pick {
    border-color: #f87171;
    background: rgba(248, 113, 113, 0.14);
    color: #ffd9d9;
  }

  .opt.wrong-pick .tag { color: #f87171; }

  .opt.faded { opacity: 0.35; }

  .verdict {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 800;
    min-height: 18px;
  }

  .verdict.ok { color: #7bf29b; }
  .verdict.no { color: #ff9f9f; }

  .log {
    max-height: 108px;
    margin-top: 12px;
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.6;
    color: #a7c4ad;
    -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent);
    mask-image: linear-gradient(180deg, #000 78%, transparent);
  }

  .log-line {
    padding: 2px 0;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
    animation: logIn 0.25s ease;
  }

  @keyframes logIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .log-line.dmg { color: #ff9f9f; }
  .log-line.crit { color: #ffd966; font-weight: 700; }
  .log-line.heal { color: #7bf29b; }
  .log-line.win { color: #b8ff7a; font-weight: 700; }
  .log-line.info { color: #a7c4ad; }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, 0.76);
    backdrop-filter: blur(4px);
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal.hidden { display: none; }

  .modal-box {
    width: 100%;
    max-width: 440px;
    padding: 20px;
    text-align: center;
    border-radius: 24px;
    background: #10251a;
    border: 1px solid rgba(132, 204, 22, 0.35);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
    animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal h2 {
    margin: 0 0 8px;
    font-size: 22px;
    color: #b8ff7a;
  }

  .modal p {
    margin: 0 0 16px;
    font-size: 13px;
    color: #9fbfa8;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .reward-card {
    padding: 16px 12px;
    border-radius: 18px;
    border: 1px solid rgba(132, 204, 22, 0.3);
    background: linear-gradient(180deg, rgba(132, 204, 22, 0.14), rgba(255, 255, 255, 0.03));
    color: #eaffdf;
    font-family: inherit;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    touch-action: manipulation;
  }

  .reward-card:hover {
    transform: translateY(-3px);
    border-color: #a3e635;
    background: linear-gradient(180deg, rgba(132, 204, 22, 0.24), rgba(255, 255, 255, 0.05));
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
  }

  .reward-card:active { transform: scale(0.97); }

  .rarity {
    display: inline-block;
    margin-bottom: 8px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 2px 8px;
    border-radius: 6px;
  }

  .rarity.common { color: #9fbfa8; background: rgba(159, 191, 168, 0.12); }
  .rarity.rare { color: #7ec8ff; background: rgba(126, 200, 255, 0.12); }
  .rarity.epic { color: #d0a3ff; background: rgba(208, 163, 255, 0.14); }

  .reward-icon {
    margin-bottom: 6px;
    font-size: 32px;
  }

  .reward-name {
    margin-bottom: 6px;
    font-size: 15px;
    font-weight: 900;
    color: #d9ff9e;
  }

  .reward-desc {
    font-size: 12px;
    line-height: 1.5;
    color: #a7c4ad;
  }

  .record-line {
    margin-bottom: 14px;
    font-size: 13px;
    color: #ffd966;
  }

  #gameOverModal .modal-box { max-width: 360px; }
  #gameOverModal p { margin-bottom: 14px; }

  /* ---------- 排行榜 ---------- */
  .board {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 14px;
  }
  .board-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 800;
    color: #ffd966;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .board-head button {
    border: none;
    background: none;
    color: #6f8a76;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    padding: 2px 4px;
  }
  .board-head button:hover { color: #a7c4ad; }
  .board-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 3px 0;
    color: #d7e8db;
  }
  .board-row .medal { width: 20px; text-align: center; }
  .board-row .bname {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
  }
  .board-row .binfo { font-size: 11px; color: #8fa896; }
  .board-empty { font-size: 12px; color: #6f8a76; padding: 2px 0; }

  .name-row { margin-bottom: 14px; }
  .name-row label {
    display: block;
    font-size: 12px;
    color: #ffd966;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .name-row input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    background: rgba(0,0,0,0.25);
    color: #eaf5ec;
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }
  .name-row input:focus { border-color: #a3e635; }

  @media (max-width: 380px) {
    .cards { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="game">
  <header>
    <div class="title">🧠 知识地下城</div>
    <div class="floor-wrap">
      <div class="floor">第 <span id="floorNum">1</span> 层</div>

  <div class="enemy-panel" id="enemyPanel">

  <div class="quiz-card" id="quizCard">

<div id="rewardModal" class="modal hidden">

  // ---------- 音效 ----------
  let audioCtx = null;
  let muted = localStorage.getItem(MUTE_KEY) === "1";

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function beep(freq, duration, type, volume, when) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime + (when || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(volume || 0.06, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
  }

  const sfx = {
    hit() { beep(180, 0.08, "square", 0.05); beep(120, 0.1, "triangle", 0.05, 0.02); },
    crit() { beep(520, 0.08, "square", 0.07); beep(760, 0.12, "square", 0.06, 0.05); },
    right() { beep(660, 0.08, "sine", 0.05); beep(880, 0.1, "sine", 0.05, 0.07); },
    wrong() { beep(200, 0.15, "sawtooth", 0.05); beep(140, 0.2, "sawtooth", 0.05, 0.12); },
    hurt() { beep(140, 0.15, "sawtooth", 0.05); },
    heal() { beep(600, 0.08, "sine", 0.05); beep(880, 0.1, "sine", 0.05, 0.06); },
    win() { beep(523, 0.1, "square", 0.05); beep(659, 0.1, "square", 0.05, 0.09); beep(784, 0.16, "square", 0.05, 0.18); },
    lose() { beep(330, 0.15, "sawtooth", 0.06); beep(220, 0.2, "sawtooth", 0.06, 0.14); beep(140, 0.3, "sawtooth", 0.06, 0.3); },
    pick() { beep(700, 0.07, "sine", 0.06); beep(1000, 0.08, "sine", 0.05, 0.06); },
    tick() { beep(900, 0.03, "square", 0.03); }
  };

  el("muteBtn").textContent = muted ? "🔇" : "🔊";
  el("muteBtn").addEventListener("click", () => {
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
    el("muteBtn").textContent = muted ? "🔇" : "🔊";

  // ---------- 历史最佳 ----------
  function getBest() {
    return parseInt(localStorage.getItem(BEST_KEY) || "0", 10);
  }

  function renderBest() {
    const best = getBest();
    el("bestFloor").textContent = best > 0 ? best : "-";
  }

  function updateBest() {
    if (state.floor > getBest()) {
      localStorage.setItem(BEST_KEY, state.floor);
      return true;
    }
    return false;
  }

  renderBest();

  // ---------- 排行榜（云端全局 Top 3，断网时本地兜底） ----------
  const LB_KEY = "knowledge-dungeon-leaderboard";
  const NAME_KEY = "knowledge-dungeon-player-name";
  const MEDALS = ["🥇", "🥈", "🥉"];
  let pendingEntry = null; // 结算时暂存，重启时提交
  let cloudBoard = [];     // 云端榜单缓存
  let cloudOk = false;     // 云端是否可用

  function localBoard() {
    try { return JSON.parse(localStorage.getItem(LB_KEY) || "[]"); }
    catch (e) { return []; }
  }

  function boardBetter(a, b) {
    if (b.floor !== a.floor) return b.floor - a.floor;
    if (b.correct !== a.correct) return b.correct - a.correct;
    return a.ts - b.ts;
  }

  function activeBoard() {
    return (cloudOk ? cloudBoard : localBoard()).map(e => ({ ...e, ts: e.ts || 0 }));
  }

  function renderBoard() {
    el("boardMode").textContent = cloudOk ? "☁️ 全区共享" : "📴 离线（仅本设备）";
    el("boardClear").style.display = cloudOk ? "none" : "";
    const list = el("boardList");
    const board = activeBoard();
    if (!board.length) {
      list.innerHTML = '<div class="board-empty">虚位以待——打出一局好成绩，留下你的名字</div>';
      return;
    }
    list.innerHTML = board.map((e, i) => {
      const name = (e.name || "无名勇士").replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
      return `<div class="board-row"><span class="medal">${MEDALS[i]}</span><span class="bname">${name}</span><span class="binfo">第 ${e.floor} 层 · 对 ${e.correct} · ${e.acc}%</span></div>`;
    }).join("");
  }

  async function fetchBoard() {
    if (!cloud) { cloudOk = false; renderBoard(); return; }
    try {
      const { data, error } = await cloud.database.from("leaderboard")
        .select("name, floor, correct, acc")
        .order("floor", { ascending: false })
        .order("correct", { ascending: false })
        .limit(3);
      if (error) throw error;
      cloudBoard = data || [];
      cloudOk = true;
    } catch (e) {
      cloudOk = false;
    }
    renderBoard();
  }

  function qualifiesForBoard(entry) {
    const board = activeBoard();
    if (entry.floor <= 1) return false;
    if (board.length < 3) return true;
    return boardBetter(entry, board[board.length - 1]) < 0;
  }

  // 结算后异步拉最新榜单再判定资格（避免缓存过期误判）
  async function judgeBoardEntry(entry) {
    pendingEntry = null;
    el("nameRow").classList.add("hidden");
    await fetchBoard();
    if (!qualifiesForBoard(entry)) return;
    pendingEntry = entry;
    const rank = activeBoard().filter(e => boardBetter(e, entry) < 0).length + 1;
    el("nameLabel").textContent = cloudOk
      ? `🏅 你杀进了全区前三（当前第 ${rank} 位）！留下大名：`
      : "📴 离线模式：你杀进了本地前三！留下大名：";
    el("nameInput").value = localStorage.getItem(NAME_KEY) || "";
    el("nameRow").classList.remove("hidden");
    setTimeout(() => el("nameInput").focus(), 300);
  }

  async function commitEntry() {
    if (!pendingEntry) return;
    const name = (el("nameInput").value || "").trim().slice(0, 12) || "无名勇士";
    localStorage.setItem(NAME_KEY, name);
    const entry = { name, floor: pendingEntry.floor, correct: pendingEntry.correct, acc: pendingEntry.acc };
    if (cloud) {
      try {
        const { error } = await cloud.database.from("leaderboard").insert(entry);
        if (error) throw error;
        await fetchBoard();
        pendingEntry = null;
        return;
      } catch (e) {
        // 云端提交失败，落到本地
      }
    }
    const board = localBoard();
    board.push({ ...entry, ts: Date.now() });
    board.sort(boardBetter);
    localStorage.setItem(LB_KEY, JSON.stringify(board.slice(0, 3)));
    pendingEntry = null;
    cloudOk = false;
    renderBoard();
  }

  el("boardClear").addEventListener("click", () => {
    localStorage.removeItem(LB_KEY);
    renderBoard();
  });

  el("nameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") el("restartBtn").click();
  });

  renderBoard();
  fetchBoard();

  // ---------- 工具 ----------
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 每个难度一个队列，抽空才重洗（保证一轮内不重复）
  const levelQueues = { 1: [], 2: [], 3: [], 4: [] };

  function refillLevel(d) {
    levelQueues[d] = shuffle(
      questionBank.map((q, i) => i).filter(i => questionBank[i].d === d)
    );
  }

  function pickLevel() {
    const f = state.floor;
    const r = Math.random();
    if (f <= 4) return r < 0.85 ? 1 : 2;
    if (f <= 9) return r < 0.4 ? 1 : 2;
    if (f <= 14) return r < 0.2 ? 1 : (r < 0.85 ? 2 : 3);
    if (f <= 19) return r < 0.35 ? 2 : 3;
    return r < 0.2 ? 2 : (r < 0.65 ? 3 : 4);
  }

  function nextQuestion() {
    let d = pickLevel();

    if (levelQueues[d].length === 0) refillLevel(d);
    if (levelQueues[d].length === 0) {
      // 该难度没题，回退到有题的难度
      d = [1, 2, 3, 4].find(x => {
        if (levelQueues[x].length === 0) refillLevel(x);
        return levelQueues[x].length > 0;
      });
    }

    const idx = levelQueues[d].pop();
    const raw = questionBank[idx];

    // 随机化选项顺序
    const order = shuffle(raw.options.map((_, i) => i));
    return {
      text: raw.q,
      options: order.map(i => raw.options[i]),
      correct: order.indexOf(raw.answer),
      d: raw.d
    };
  }

  function makeEnemy(floor) {
    const isBoss = floor % 10 === 0;
    const isElite = !isBoss && floor % 5 === 0;

    let baseName, face;
    if (isBoss) {
      [baseName, face] = bossNames[Math.floor(floor / 10 - 1) % bossNames.length];
    } else {
      [baseName, face] = enemyNames[(floor - 1) % enemyNames.length];
    }

    let hp = Math.floor(25 + floor * 12 + floor * floor * 0.6);
    let atk = Math.floor(4 + floor * 2.1);

    if (isElite) { hp = Math.floor(hp * 1.35); atk = Math.floor(atk * 1.15); }
    if (isBoss) { hp = Math.floor(hp * 1.8); atk = Math.floor(atk * 1.4); }

    return {
      name: baseName + (isBoss ? " 👑" : isElite ? " · 精英" : ""),
      face,
      hp,
      maxHp: hp,
      atk,
      isBoss
    };
  }

  function effectiveAtk() {
    return state.atk + Math.floor(state.watermelon / 10) * state.watermelonPower;
  }

  function spawnEnemy() {
    state.enemy = makeEnemy(state.floor);
    state.shield = state.shieldPerFloor;
    state.busy = false;
    updateUI();
  }

  // ---------- 浮动数字 / 震动 ----------
  function floatNum(panelId, text, cls) {
    const panel = el(panelId);
    const span = document.createElement("span");
    span.className = "float-num" + (cls ? " " + cls : "");
    span.textContent = text;
    panel.appendChild(span);
    setTimeout(() => span.remove(), 950);
  }

  function shake(panelId, crit) {
    const panel = el(panelId);
    panel.classList.remove("panel-hit", "panel-hit-crit");
    void panel.offsetWidth;
    panel.classList.add(crit ? "panel-hit-crit" : "panel-hit");
  }

  function bumpStat(id) {
    const node = el(id);
    node.classList.remove("bump");
    void node.offsetWidth;
    node.classList.add("bump");
  }

  function enemyHurtFx() {
    const panel = el("enemyPanel");
    panel.classList.remove("hurt");
    void panel.offsetWidth;
    panel.classList.add("hurt");
  }

  // ---------- UI ----------
  function updateUI() {
    el("floorNum").textContent = state.floor;
    el("watermelon").textContent = state.watermelon;
    el("atk").textContent = effectiveAtk();
    el("crit").textContent = Math.round(state.crit * 100) + "%";
    el("acc").textContent = state.answered > 0
      ? Math.round(state.correct / state.answered * 100) + "%"
      : "-";
    el("lifesteal").textContent = state.lifesteal;
    el("shield").textContent = state.shield;
    el("thorns").textContent = state.thorns;
    el("timeLimitText").textContent = state.timeLimit + "s";
    el("streak").textContent = state.streak;

    const playerPct = Math.max(0, state.hp / state.maxHp * 100);
    el("playerHpBar").style.width = playerPct + "%";
    el("playerHpBar").classList.toggle("low", playerPct < 30);
    el("playerHpText").textContent =
      Math.max(0, Math.floor(state.hp)) + "/" + state.maxHp;

    const enemy = state.enemy;
    if (enemy) {
      el("enemyName").textContent = enemy.name;
      el("enemyFace").textContent = enemy.face;
      el("enemyAtk").textContent = enemy.atk;
      el("enemyHpBar").style.width =
        Math.max(0, enemy.hp / enemy.maxHp * 100) + "%";
      el("enemyHpText").textContent =
        Math.max(0, Math.floor(enemy.hp)) + "/" + enemy.maxHp;
    }
  }

  function log(message, type) {
    const line = document.createElement("div");
    line.className = "log-line" + (type ? " " + type : "");
    line.textContent = message;
    el("log").prepend(line);

    while (el("log").children.length > 8) {
      el("log").lastChild.remove();
    }
  }

  // ---------- 出题 ----------
  let timer = null;
  let lastTickWhole = null;

  function showQuestion() {
    if (!state.alive || state.enemy.hp <= 0) return;

    state.currentQ = nextQuestion();
    state.timeLeft = state.timeLimit;
    state.busy = false;
    updateUI();

    const card = el("quizCard");
    card.classList.remove("right", "wrong");

    const stars = "★".repeat(state.currentQ.d) + "☆".repeat(4 - state.currentQ.d);
    const cls = state.currentQ.d >= 4 ? "hard" : state.currentQ.d === 3 ? "mid" : "";
    el("questionText").innerHTML =
      `<span class="qnum ${cls}">Q${state.answered + 1} · ${stars}</span>${state.currentQ.text}`;

    const verdict = el("verdict");
    verdict.textContent = "";
    verdict.className = "verdict";

    const container = el("options");
    container.innerHTML = "";
    const tags = ["A", "B", "C", "D"];

    state.currentQ.options.forEach((optText, i) => {
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.innerHTML = `<span class="tag">${tags[i]}</span>${optText}`;
      btn.onclick = () => handleAnswer(i);
      container.appendChild(btn);
    });

    lastTickWhole = Math.ceil(state.timeLeft);
    timer = setInterval(tick, 100);
    updateTimerBar();
  }

  function updateTimerBar() {
    const fill = el("timeFill");
    const pct = Math.max(0, state.timeLeft / state.timeLimit * 100);
    fill.style.width = pct + "%";
    fill.classList.toggle("urgent", pct < 30);

    const whole = Math.ceil(state.timeLeft);
    if (whole <= 5 && whole !== lastTickWhole && whole > 0) {
      lastTickWhole = whole;
      sfx.tick();
    }
  }

  function tick() {
    state.timeLeft -= 0.1;
    updateTimerBar();

    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      handleAnswer(-1);
    }
  }

  function stopTimer() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
  }

  // ---------- 答题判定 ----------
  function handleAnswer(pick) {
    if (!state.alive || state.busy || !state.currentQ) return;
    if (pick >= 0 && !timer) return;

    stopTimer();
    state.busy = true;
    state.answered += 1;

    const isRight = pick === state.currentQ.correct;
    const card = el("quizCard");
    const buttons = [...el("options").children];

    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === state.currentQ.correct) {
        btn.classList.add("correct");
      } else if (i === pick) {
        btn.classList.add("wrong-pick");
      } else {
        btn.classList.add("faded");
      }
    });

    const verdict = el("verdict");

    if (isRight) {
      state.correct += 1;
      state.streak += 1;
      card.classList.add("right");
      sfx.right();

      const fast = state.timeLeft / state.timeLimit >= 0.6;
      verdict.textContent = fast
        ? `✅ 正确！快答加成（剩 ${Math.ceil(state.timeLeft)}s）`
        : "✅ 正确！";
      verdict.className = "verdict ok";

      playerStrike(fast);
      updateUI();

      if (state.enemy.hp <= 0) {
        state.enemy.hp = 0;
        updateUI();
        setTimeout(winFloor, 600);
      } else {
        setTimeout(showQuestion, 1200);
      }
    } else {
      state.streak = 0;
      card.classList.add("wrong");
      sfx.wrong();

      const rightText = state.currentQ.options[state.currentQ.correct];
      verdict.textContent = (pick < 0
        ? "⏰ 超时！正确答案是："
        : "❌ 答错了！正确答案是：") + rightText;
      verdict.className = "verdict no";

      log(`答错一题，${state.enemy.name} 发起攻击`, "info");
      updateUI();

      setTimeout(() => {
        enemyStrike();
        updateUI();

        if (state.hp <= 0) {
          state.hp = 0;
          state.alive = false;
          updateUI();
          setTimeout(gameOver, 500);
        } else {
          setTimeout(showQuestion, 1100);
        }
      }, 700);
    }
  }

  function playerStrike(fast) {
    let damage = effectiveAtk();
    const isCrit = Math.random() < state.crit;

    if (isCrit) damage = Math.floor(damage * 2);
    if (fast) damage = Math.floor(damage * 1.5);

    let comboDamage = 0;
    if (state.streak >= 3 && Math.random() < state.comboRate) {
      comboDamage = Math.floor(damage * 0.5);
    }

    const totalDamage = damage + comboDamage;
    state.enemy.hp -= totalDamage;

    state.watermelon += 1;
    bumpStat("watermelon");

    if (isCrit) {
      log(`💥 暴击！造成 ${totalDamage} 伤害（+1 🍉）`, "crit");
      floatNum("enemyPanel", "暴击 -" + totalDamage, "crit");
      shake("enemyPanel", true);
      sfx.crit();
    } else {
      log(`答对挥刀，造成 ${totalDamage} 伤害${fast ? "（快答加成）" : ""}${comboDamage ? "，心流连击！" : ""}（+1 🍉）`, "dmg");
      floatNum("enemyPanel", "-" + totalDamage);
      shake("enemyPanel", false);
      sfx.hit();
    }

    enemyHurtFx();

    if (state.lifesteal > 0 && state.hp < state.maxHp) {
      const heal = Math.min(state.lifesteal, state.maxHp - state.hp);
      state.hp += heal;
      log(`智慧回甘，回复 ${heal} HP`, "heal");
      floatNum("playerPanel", "+" + heal, "heal");
      sfx.heal();
    }
  }

  function enemyStrike() {
    if (!state.alive || !state.enemy || state.enemy.hp <= 0) return;

    let damage = state.enemy.atk;

    if (state.shield > 0) {
      const absorbed = Math.min(state.shield, damage);
      state.shield -= absorbed;
      damage -= absorbed;

      if (absorbed > 0) {
        log(`瓜皮护盾吸收 ${absorbed} 伤害`);
        floatNum("playerPanel", "盾 -" + absorbed);
      }
    }

    if (damage > 0) {
      state.hp -= damage;
      log(`${state.enemy.name} 攻击，造成 ${damage} 伤害`, "dmg");
      floatNum("playerPanel", "-" + damage);
      shake("playerPanel", false);
      sfx.hurt();
    }

    if (state.thorns > 0 && state.enemy.hp > 0) {
      state.enemy.hp -= state.thorns;
      log(`反思之刺反弹 ${state.thorns} 伤害`, "dmg");
      floatNum("enemyPanel", "-" + state.thorns);
    }
  }

  function winFloor() {
    if (!state.alive) return;

    state.busy = true;
    stopTimer();
    sfx.win();

    let gain = 5 + state.floor + state.watermelonBonus;
    if (state.enemy && state.enemy.isBoss) {
      gain *= 3;
      log(`👑 击败 Boss！获得 ${gain} 个西瓜`, "win");
    } else {
      log(`🎉 通关第 ${state.floor} 层，获得 ${gain} 个西瓜`, "win");
    }
    state.watermelon += gain;
    bumpStat("watermelon");
    updateUI();

    setTimeout(showRewards, 420);
  }

  // ---------- 奖励 ----------
  const rewardPool = [
    {
      icon: "💪", name: "逻辑强化", desc: "攻击力 +3", rarity: "common",
      apply: s => { s.atk += 3; }
    },
    {
      icon: "❤️", name: "知识韧性", desc: "最大生命 +20，并回复 20 HP", rarity: "common",
      apply: s => {
        s.maxHp += 20;
        s.hp = Math.min(s.maxHp, s.hp + 20);
      }
    },
    {
      icon: "🎯", name: "灵光一闪", desc: "暴击率 +8%", rarity: "rare",
      apply: s => { s.crit = Math.min(0.75, s.crit + 0.08); }
    },
    {
      icon: "🧃", name: "智慧回甘", desc: "答对时回复 +2 HP", rarity: "rare",
      apply: s => { s.lifesteal += 2; }
    },
    {
      icon: "🛡️", name: "经验护盾", desc: "每层开始获得 +5 护盾", rarity: "common",
      apply: s => { s.shieldPerFloor += 5; }
    },
    {
      icon: "⚡", name: "心流状态", desc: "连对 3 题后，15% 概率追加 50% 伤害", rarity: "rare",
      apply: s => { s.comboRate = Math.min(0.6, s.comboRate + 0.15); }
    },
    {
      icon: "🍉", name: "学分丰收", desc: "每层通关额外 +3 西瓜", rarity: "common",
      apply: s => { s.watermelonBonus += 3; }
    },
    {
      icon: "🌱", name: "学以致用", desc: "每 10 个西瓜提供 +1 攻击，可叠加", rarity: "epic",
      apply: s => { s.watermelonPower += 1; }
    },
    {
      icon: "🍹", name: "课后补习", desc: "立即回复 30 HP", rarity: "common",
      apply: s => {
        s.hp = Math.min(s.maxHp, s.hp + 30);
      }
    },
    {
      icon: "🌵", name: "反思之刺", desc: "答错挨打时反弹 +2 伤害", rarity: "rare",
      apply: s => { s.thorns += 2; }
    },
    {
      icon: "⏳", name: "从容不迫", desc: "答题时间 +3 秒", rarity: "epic",
      apply: s => { s.timeLimit += 3; }
    }
  ];

  function showRewards() {
    const pool = [...rewardPool];

    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    const choices = pool.slice(0, 2);
    const container = el("rewardCards");
    container.innerHTML = "";

    choices.forEach(reward => {
      const card = document.createElement("button");
      card.className = "reward-card";
      card.innerHTML = `
        <span class="rarity ${reward.rarity}">${reward.rarity === "epic" ? "EPIC" : reward.rarity === "rare" ? "RARE" : "COMMON"}</span>
        <div class="reward-icon">${reward.icon}</div>
        <div class="reward-name">${reward.name}</div>
        <div class="reward-desc">${reward.desc}</div>
      `;
      card.onclick = () => chooseReward(reward);
      container.appendChild(card);
    });

    el("rewardModal").classList.remove("hidden");
  }

  function chooseReward(reward) {
    ensureAudio();
    reward.apply(state);
    sfx.pick();

    el("rewardModal").classList.add("hidden");
    log(`选择奖励：${reward.icon} ${reward.name}`, "win");

    state.floor += 1;
    state.busy = false;
    spawnEnemy();

    const newEnemy = state.enemy;
    log(`进入第 ${state.floor} 层${newEnemy.isBoss ? " —— 👑 Boss 出现！" : newEnemy.name.includes("精英") ? " —— ⚠️ 精英敌人！" : ""}`, newEnemy.isBoss ? "crit" : "info");
    setTimeout(showQuestion, 350);
  }

  // ---------- 结束 / 重开 ----------
  function gameOver() {
    stopTimer();
    sfx.lose();

    const isRecord = updateBest();
    renderBest();

    const acc = state.answered > 0
      ? Math.round(state.correct / state.answered * 100)
      : 0;

    el("gameOverText").innerHTML =
      `你到达了第 ${state.floor} 层，收集了 ${state.watermelon} 个西瓜。<br>` +
      `共答题 ${state.answered} 道，答对 ${state.correct} 道，正确率 ${acc}%。`;

    const recordLine = el("recordLine");
    if (isRecord && state.floor > 1) {
      recordLine.textContent = `🏆 新纪录！历史最佳：第 ${state.floor} 层`;
      recordLine.classList.remove("hidden");
    } else {
      recordLine.classList.add("hidden");
    }

    // 排行榜资格判定
    pendingEntry = null;
    el("nameRow").classList.add("hidden");
    const entry = { floor: state.floor, correct: state.correct, acc, ts: Date.now() };
    judgeBoardEntry(entry); // 异步拉最新榜单并判定资格

    el("gameOverModal").classList.remove("hidden");
  }

  function restart() {
    stopTimer();
    commitEntry(); // 提交排行榜成绩（若本局进了前三）

    Object.assign(state, {
      floor: 1,
      watermelon: 0,
      hp: 100,
      maxHp: 100,
      atk: 10,
      shield: 0,
      crit: 0.05,
      lifesteal: 0,
      comboRate: 0,
      thorns: 0,
      shieldPerFloor: 0,
      watermelonBonus: 0,
      watermelonPower: 0,
      timeLimit: 15,
      streak: 0,
      answered: 0,
      correct: 0,
      enemy: null,
      busy: false,
      alive: true,
      currentQ: null
    });

    levelQueues[1] = [];
    levelQueues[2] = [];
    levelQueues[3] = [];
    levelQueues[4] = [];
    el("log").innerHTML = "";
    el("gameOverModal").classList.add("hidden");
    el("rewardModal").classList.add("hidden");

    log("新的冒险开始：答对挥刀，答错挨打！", "info");
    spawnEnemy();
    setTimeout(showQuestion, 350);
  }

  el("restartBtn").addEventListener("click", restart);

  document.addEventListener("keydown", e => {
    if (state.busy || !state.alive) return;
    const map = { "1": 0, "2": 1, "3": 2, "4": 3, "a": 0, "b": 1, "c": 2, "d": 3 };
    const idx = map[e.key.toLowerCase()];
    if (idx !== undefined && timer) {
      handleAnswer(idx);
    }
  });

  log("新的冒险开始：答对挥刀，答错挨打！", "info");
  spawnEnemy();
  setTimeout(showQuestion, 400);
</script>
