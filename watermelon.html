<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>西瓜地下城 · 二选一冒险</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background:
      radial-gradient(circle at 20% 10%, rgba(132, 204, 22, 0.18), transparent 35%),
      radial-gradient(circle at 80% 90%, rgba(220, 38, 38, 0.12), transparent 35%),
      #07110c;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eaffdf;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .game {
    width: 100%;
    max-width: 470px;
    padding: 18px;
    border-radius: 26px;
    background: rgba(12, 32, 22, 0.92);
    border: 1px solid rgba(132, 204, 22, 0.22);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    position: relative;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title {
    font-size: 22px;
    font-weight: 900;
    color: #b8ff7a;
    letter-spacing: 0.5px;
  }

  .floor-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .floor {
    font-size: 13px;
    color: #ffd966;
    background: rgba(255, 217, 102, 0.08);
    border: 1px solid rgba(255, 217, 102, 0.22);
    padding: 6px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  #muteBtn {
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid rgba(255, 217, 102, 0.22);
    border-radius: 999px;
    background: rgba(255, 217, 102, 0.08);
    color: #ffd966;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
    transition: transform 0.12s ease;
  }

  #muteBtn:active { transform: scale(0.9); }

  .best {
    margin-top: 8px;
    font-size: 11px;
    color: #6f8f78;
    text-align: right;
  }

  .best b { color: #ffd966; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 12px 0 14px;
  }

  .stat {
    padding: 8px 4px;
    border-radius: 12px;
    text-align: center;
    background: rgba(255, 255, 255, 0.055);
    font-size: 11px;
    color: #9fbfa8;
  }

  .stat b {
    display: block;
    margin-top: 3px;
    font-size: 15px;
    color: #eaffdf;
  }

  .stat b.bump {
    animation: statBump 0.3s ease;
  }

  @keyframes statBump {
    0% { transform: scale(1); color: #b8ff7a; }
    50% { transform: scale(1.35); color: #b8ff7a; }
    100% { transform: scale(1); }
  }

  .player-panel,
  .enemy-panel {
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.055);
    position: relative;
    overflow: hidden;
  }

  .panel-hit {
    animation: panelShake 0.3s ease;
  }

  @keyframes panelShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }

  .panel-hit-crit {
    animation: panelShake 0.3s ease, critFlash 0.4s ease;
  }

  @keyframes critFlash {
    0% { background: rgba(255, 217, 102, 0.28); }
    100% { background: rgba(255, 255, 255, 0.05); }
  }

  .float-num {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: 900;
    color: #ff8f8f;
    pointer-events: none;
    animation: floatUp 0.9s ease forwards;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    z-index: 5;
    white-space: nowrap;
  }

  .float-num.crit {
    font-size: 30px;
    color: #ffd966;
  }

  .float-num.heal {
    color: #7bf29b;
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 12px) scale(0.6); }
    18% { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -46px) scale(1); }
  }

  .bar-label {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
    font-size: 12px;
    color: #9fbfa8;
  }

  .hpbar {
    height: 12px;
    overflow: hidden;
    border-radius: 999px;
    background: #1b2b22;
  }

  .hpfill {
    width: 100%;
    height: 100%;
    border-radius: inherit;
    transition: width 0.25s ease;
  }

  .hpfill.player {
    background: linear-gradient(90deg, #4ade80, #22c55e);
  }

  .hpfill.player.low {
    background: linear-gradient(90deg, #fb923c, #dc2626);
    animation: lowHp 0.8s ease-in-out infinite;
  }

  @keyframes lowHp {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .hpfill.enemy {
    background: linear-gradient(90deg, #f87171, #dc2626);
  }

  .substats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    margin-top: 9px;
    font-size: 12px;
    color: #9fbfa8;
  }

  .substats b { color: #eaffdf; }

  .enemy-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 7px;
    font-size: 15px;
    font-weight: 800;
    color: #ffe3a3;
  }

  .enemy-face {
    font-size: 26px;
    line-height: 1;
    animation: enemyIdle 1.8s ease-in-out infinite;
  }

  .enemy-panel.hurt .enemy-face { animation: enemyHurt 0.35s ease; }

  @keyframes enemyIdle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  @keyframes enemyHurt {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-14deg) scale(1.15); }
    60% { transform: rotate(10deg); }
  }

  .enemy-name-text {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .enemy-title span:last-child {
    font-size: 12px;
    font-weight: 500;
    color: #9fbfa8;
    white-space: nowrap;
  }

  .boss-badge {
    font-size: 10px;
    font-weight: 900;
    color: #ff9f6f;
    background: rgba(255, 159, 111, 0.12);
    border: 1px solid rgba(255, 159, 111, 0.35);
    padding: 2px 6px;
    border-radius: 6px;
    letter-spacing: 1px;
  }

  #attackBtn,
  #restartBtn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #a3e635, #22c55e);
    color: #06210f;
    font-family: inherit;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(34, 197, 94, 0.25);
    transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
    touch-action: manipulation;
  }

  #attackBtn:hover:not(:disabled),
  #restartBtn:hover {
    box-shadow: 0 10px 28px rgba(34, 197, 94, 0.4);
  }

  #attackBtn:active:not(:disabled),
  #restartBtn:active { transform: scale(0.98); }

  #attackBtn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    box-shadow: none;
  }

  .hint {
    margin-top: 8px;
    font-size: 11px;
    color: #5f7a68;
    text-align: center;
  }

  .log {
    max-height: 118px;
    margin-top: 12px;
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.6;
    color: #a7c4ad;
    -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent);
    mask-image: linear-gradient(180deg, #000 78%, transparent);
  }

  .log-line {
    padding: 2px 0;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
    animation: logIn 0.25s ease;
  }

  @keyframes logIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .log-line.dmg { color: #ff9f9f; }
  .log-line.crit { color: #ffd966; font-weight: 700; }
  .log-line.heal { color: #7bf29b; }
  .log-line.win { color: #b8ff7a; font-weight: 700; }
  .log-line.info { color: #a7c4ad; }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, 0.76);
    backdrop-filter: blur(4px);
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal.hidden { display: none; }

  .modal-box {
    width: 100%;
    max-width: 440px;
    padding: 20px;
    text-align: center;
    border-radius: 24px;
    background: #10251a;
    border: 1px solid rgba(132, 204, 22, 0.35);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
    animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal h2 {
    margin: 0 0 8px;
    font-size: 22px;
    color: #b8ff7a;
  }

  .modal p {
    margin: 0 0 16px;
    font-size: 13px;
    color: #9fbfa8;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .reward-card {
    padding: 16px 12px;
    border-radius: 18px;
    border: 1px solid rgba(132, 204, 22, 0.3);
    background: linear-gradient(180deg, rgba(132, 204, 22, 0.14), rgba(255, 255, 255, 0.03));
    color: #eaffdf;
    font-family: inherit;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    touch-action: manipulation;
  }

  .reward-card:hover {
    transform: translateY(-3px);
    border-color: #a3e635;
    background: linear-gradient(180deg, rgba(132, 204, 22, 0.24), rgba(255, 255, 255, 0.05));
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
  }

  .reward-card:active { transform: scale(0.97); }

  .rarity {
    display: inline-block;
    margin-bottom: 8px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 2px 8px;
    border-radius: 6px;
  }

  .rarity.common { color: #9fbfa8; background: rgba(159, 191, 168, 0.12); }
  .rarity.rare { color: #7ec8ff; background: rgba(126, 200, 255, 0.12); }
  .rarity.epic { color: #d0a3ff; background: rgba(208, 163, 255, 0.14); }

  .reward-icon {
    margin-bottom: 6px;
    font-size: 32px;
  }

  .reward-name {
    margin-bottom: 6px;
    font-size: 15px;
    font-weight: 900;
    color: #d9ff9e;
  }

  .reward-desc {
    font-size: 12px;
    line-height: 1.5;
    color: #a7c4ad;
  }

  .record-line {
    margin-bottom: 14px;
    font-size: 13px;
    color: #ffd966;
  }

  #gameOverModal .modal-box { max-width: 360px; }
  #gameOverModal p { margin-bottom: 18px; }

  @media (max-width: 380px) {
    .cards { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="game">
  <header>
    <div class="title">🍉 西瓜地下城</div>
    <div class="floor-wrap">
      <div class="floor">第 <span id="floorNum">1</span> 层</div>
      <button id="muteBtn" title="音效开关">🔊</button>
    </div>
  </header>

  <div class="best">🏆 历史最佳：第 <b id="bestFloor">-</b> 层</div>

  <div class="stats">
    <div class="stat"><span>🍉 西瓜</span><b id="watermelon">0</b></div>
    <div class="stat"><span>⚔️ 攻击</span><b id="atk">10</b></div>
    <div class="stat"><span>🎯 暴击</span><b id="crit">5%</b></div>
    <div class="stat"><span>🧃 吸血</span><b id="lifesteal">0</b></div>
  </div>

  <div class="player-panel" id="playerPanel">
    <div class="bar-label">
      <span>你的生命</span>
      <span id="playerHpText">100/100</span>
    </div>
    <div class="hpbar">
      <div id="playerHpBar" class="hpfill player"></div>
    </div>
    <div class="substats">
      <span>🛡️ 护盾 <b id="shield">0</b></span>
      <span>🌿 连击 <b id="combo">0%</b></span>
      <span>🌵 反伤 <b id="thorns">0</b></span>
      <span>🍉 瓜力 <b id="power">0</b></span>
    </div>
  </div>

  <div class="enemy-panel" id="enemyPanel">
    <div class="enemy-title">
      <span class="enemy-name-text">
        <span class="enemy-face" id="enemyFace">🍏</span>
        <span id="enemyName">瓜田史莱姆</span>
      </span>
      <span>攻击 <b id="enemyAtk">6</b></span>
    </div>
    <div class="hpbar">
      <div id="enemyHpBar" class="hpfill enemy"></div>
    </div>
    <div class="bar-label">
      <span>敌人生命</span>
      <span id="enemyHpText">37/37</span>
    </div>
  </div>

  <button id="attackBtn">挥瓜攻击</button>
  <div class="hint">空格键也可以出刀 · 每 10 层有大 Boss</div>
  <div id="log" class="log"></div>
</div>

<div id="rewardModal" class="modal hidden">
  <div class="modal-box">
    <h2>🍉 通关结算</h2>
    <p>选择一张奖励卡，进入下一层</p>
    <div id="rewardCards" class="cards"></div>
  </div>
</div>

<div id="gameOverModal" class="modal hidden">
  <div class="modal-box">
    <h2>💀 你倒在了地下城</h2>
    <p id="gameOverText"></p>
    <div id="recordLine" class="record-line hidden"></div>
    <button id="restartBtn">重新开始</button>
  </div>
</div>

<script>
  const el = id => document.getElementById(id);

  const BEST_KEY = "watermelon-dungeon-best";
  const MUTE_KEY = "watermelon-dungeon-mute";

  const state = {
    floor: 1,
    watermelon: 0,
    hp: 100,
    maxHp: 100,
    atk: 10,
    shield: 0,
    crit: 0.05,
    lifesteal: 0,
    comboRate: 0,
    thorns: 0,
    shieldPerFloor: 0,
    watermelonBonus: 0,
    watermelonPower: 0,
    enemy: null,
    busy: false,
    alive: true
  };

  const enemyNames = [
    ["瓜田史莱姆", "🍏"],
    ["蝙蝠瓜", "🦇"],
    ["骷髅瓜兵", "💀"],
    ["石像瓜卫", "🗿"],
    ["藤蔓怪", "🌿"],
    ["地下瓜虫", "🐛"],
    ["瓜妖", "👺"],
    ["瓜王守卫", "🛡️"]
  ];

  const bossNames = [
    ["西瓜暴君", "🍉"],
    ["黑暗瓜神", "🌚"],
    ["万年瓜祖", "🐲"]
  ];

  // ---------- 音效（WebAudio 合成，无外部资源） ----------
  let audioCtx = null;
  let muted = localStorage.getItem(MUTE_KEY) === "1";

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function beep(freq, duration, type, volume, when) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime + (when || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(volume || 0.06, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
  }

  const sfx = {
    hit() { beep(180, 0.08, "square", 0.05); beep(120, 0.1, "triangle", 0.05, 0.02); },
    crit() { beep(520, 0.08, "square", 0.07); beep(760, 0.12, "square", 0.06, 0.05); },
    hurt() { beep(140, 0.15, "sawtooth", 0.05); },
    heal() { beep(600, 0.08, "sine", 0.05); beep(880, 0.1, "sine", 0.05, 0.06); },
    win() { beep(523, 0.1, "square", 0.05); beep(659, 0.1, "square", 0.05, 0.09); beep(784, 0.16, "square", 0.05, 0.18); },
    lose() { beep(330, 0.15, "sawtooth", 0.06); beep(220, 0.2, "sawtooth", 0.06, 0.14); beep(140, 0.3, "sawtooth", 0.06, 0.3); },
    pick() { beep(700, 0.07, "sine", 0.06); beep(1000, 0.08, "sine", 0.05, 0.06); }
  };

  el("muteBtn").textContent = muted ? "🔇" : "🔊";
  el("muteBtn").addEventListener("click", () => {
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
    el("muteBtn").textContent = muted ? "🔇" : "🔊";
  });

  // ---------- 历史最佳 ----------
  function getBest() {
    return parseInt(localStorage.getItem(BEST_KEY) || "0", 10);
  }

  function renderBest() {
    const best = getBest();
    el("bestFloor").textContent = best > 0 ? best : "-";
  }

  function updateBest() {
    if (state.floor > getBest()) {
      localStorage.setItem(BEST_KEY, state.floor);
      return true;
    }
    return false;
  }

  renderBest();

  // ---------- 数值 ----------
  function makeEnemy(floor) {
    const isBoss = floor % 10 === 0;
    const isElite = !isBoss && floor % 5 === 0;

    let baseName, face;
    if (isBoss) {
      [baseName, face] = bossNames[Math.floor(floor / 10 - 1) % bossNames.length];
    } else {
      [baseName, face] = enemyNames[(floor - 1) % enemyNames.length];
    }

    let hp = Math.floor(25 + floor * 12 + floor * floor * 0.6);
    let atk = Math.floor(4 + floor * 2.1);

    if (isElite) { hp = Math.floor(hp * 1.35); atk = Math.floor(atk * 1.15); }
    if (isBoss) { hp = Math.floor(hp * 1.8); atk = Math.floor(atk * 1.4); }

    return {
      name: baseName + (isBoss ? "" : isElite ? " · 精英" : ""),
      face,
      hp,
      maxHp: hp,
      atk,
      isBoss
    };
  }

  function effectiveAtk() {
    return state.atk + Math.floor(state.watermelon / 10) * state.watermelonPower;
  }

  function spawnEnemy() {
    state.enemy = makeEnemy(state.floor);
    state.shield = state.shieldPerFloor;
    state.busy = false;
    updateUI();
  }

  // ---------- 浮动数字 / 震动 ----------
  function floatNum(panelId, text, cls) {
    const panel = el(panelId);
    const span = document.createElement("span");
    span.className = "float-num" + (cls ? " " + cls : "");
    span.textContent = text;
    panel.appendChild(span);
    setTimeout(() => span.remove(), 950);
  }

  function shake(panelId, crit) {
    const panel = el(panelId);
    panel.classList.remove("panel-hit", "panel-hit-crit");
    void panel.offsetWidth;
    panel.classList.add(crit ? "panel-hit-crit" : "panel-hit");
  }

  function bumpStat(id) {
    const node = el(id);
    node.classList.remove("bump");
    void node.offsetWidth;
    node.classList.add("bump");
  }

  function enemyHurtFx() {
    const panel = el("enemyPanel");
    panel.classList.remove("hurt");
    void panel.offsetWidth;
    panel.classList.add("hurt");
  }

  // ---------- UI ----------
  function updateUI() {
    el("floorNum").textContent = state.floor;
    el("watermelon").textContent = state.watermelon;
    el("atk").textContent = effectiveAtk();
    el("crit").textContent = Math.round(state.crit * 100) + "%";
    el("lifesteal").textContent = state.lifesteal;
    el("shield").textContent = state.shield;
    el("combo").textContent = Math.round(state.comboRate * 100) + "%";
    el("thorns").textContent = state.thorns;
    el("power").textContent = state.watermelonPower;

    const playerPct = Math.max(0, state.hp / state.maxHp * 100);
    el("playerHpBar").style.width = playerPct + "%";
    el("playerHpBar").classList.toggle("low", playerPct < 30);
    el("playerHpText").textContent =
      Math.max(0, Math.floor(state.hp)) + "/" + state.maxHp;

    const enemy = state.enemy;
    if (enemy) {
      el("enemyName").textContent = enemy.name;
      el("enemyFace").textContent = enemy.face;
      el("enemyAtk").textContent = enemy.atk;
      el("enemyHpBar").style.width =
        Math.max(0, enemy.hp / enemy.maxHp * 100) + "%";
      el("enemyHpText").textContent =
        Math.max(0, Math.floor(enemy.hp)) + "/" + enemy.maxHp;
    }

    el("attackBtn").disabled =
      state.busy || !state.alive || !enemy || enemy.hp <= 0;
  }

  function log(message, type) {
    const line = document.createElement("div");
    line.className = "log-line" + (type ? " " + type : "");
    line.textContent = message;
    el("log").prepend(line);

    while (el("log").children.length > 8) {
      el("log").lastChild.remove();
    }
  }

  // ---------- 战斗 ----------
  function playerAttack() {
    if (state.busy || !state.alive || !state.enemy || state.enemy.hp <= 0) {
      return;
    }

    ensureAudio();
    state.busy = true;
    updateUI();

    let damage = effectiveAtk();
    const isCrit = Math.random() < state.crit;

    if (isCrit) {
      damage = Math.floor(damage * 2);
    }

    let comboDamage = 0;
    const isCombo = Math.random() < state.comboRate;

    if (isCombo) {
      comboDamage = Math.floor(damage * 0.5);
    }

    const totalDamage = damage + comboDamage;
    state.enemy.hp -= totalDamage;

    if (isCrit) {
      log(`💥 暴击！${isCombo ? "外加连击！" : ""}造成 ${totalDamage} 伤害`, "crit");
      floatNum("enemyPanel", "暴击 -" + totalDamage, "crit");
      shake("enemyPanel", true);
      sfx.crit();
    } else {
      log(`你挥瓜攻击${isCombo ? "，连击！" : ""}造成 ${totalDamage} 伤害`, "dmg");
      floatNum("enemyPanel", "-" + totalDamage);
      shake("enemyPanel", false);
      sfx.hit();
    }

    enemyHurtFx();

    if (state.lifesteal > 0 && state.hp < state.maxHp) {
      const heal = Math.min(state.lifesteal, state.maxHp - state.hp);
      state.hp += heal;
      log(`瓜汁吸血，回复 ${heal} HP`, "heal");
      floatNum("playerPanel", "+" + heal, "heal");
      sfx.heal();
    }

    updateUI();

    if (state.enemy.hp <= 0) {
      state.enemy.hp = 0;
      updateUI();
      setTimeout(winFloor, 320);
      return;
    }

    setTimeout(enemyAttack, 400);
  }

  function enemyAttack() {
    if (!state.alive || !state.enemy || state.enemy.hp <= 0) {
      return;
    }

    let damage = state.enemy.atk;

    if (state.shield > 0) {
      const absorbed = Math.min(state.shield, damage);
      state.shield -= absorbed;
      damage -= absorbed;

      if (absorbed > 0) {
        log(`瓜皮护盾吸收 ${absorbed} 伤害`);
        floatNum("playerPanel", "盾 -" + absorbed);
      }
    }

    if (damage > 0) {
      state.hp -= damage;
      log(`${state.enemy.name} 攻击，造成 ${damage} 伤害`, "dmg");
      floatNum("playerPanel", "-" + damage);
      shake("playerPanel", false);
      sfx.hurt();
    }

    if (state.thorns > 0 && state.enemy.hp > 0) {
      state.enemy.hp -= state.thorns;
      log(`荆棘瓜皮反弹 ${state.thorns} 伤害`, "dmg");
      floatNum("enemyPanel", "-" + state.thorns);
    }

    updateUI();

    if (state.hp <= 0) {
      state.hp = 0;
      state.alive = false;
      updateUI();
      setTimeout(gameOver, 320);
      return;
    }

    if (state.enemy.hp <= 0) {
      state.enemy.hp = 0;
      updateUI();
      setTimeout(winFloor, 320);
      return;
    }

    state.busy = false;
    updateUI();
  }

  function winFloor() {
    if (!state.alive) return;

    state.busy = true;
    sfx.win();

    let gain = 5 + state.floor + state.watermelonBonus;
    if (state.enemy && state.enemy.isBoss) {
      gain *= 3;
      log(`👑 击败 Boss！获得 ${gain} 个西瓜`, "win");
    } else {
      log(`🎉 通关第 ${state.floor} 层，获得 ${gain} 个西瓜`, "win");
    }
    state.watermelon += gain;
    bumpStat("watermelon");
    updateUI();

    setTimeout(showRewards, 420);
  }

  // ---------- 奖励 ----------
  const rewardPool = [
    {
      icon: "💪", name: "西瓜重击", desc: "攻击力 +3", rarity: "common",
      apply: s => { s.atk += 3; }
    },
    {
      icon: "❤️", name: "瓜瓤生命", desc: "最大生命 +20，并回复 20 HP", rarity: "common",
      apply: s => {
        s.maxHp += 20;
        s.hp = Math.min(s.maxHp, s.hp + 20);
      }
    },
    {
      icon: "🎯", name: "暴击种子", desc: "暴击率 +8%", rarity: "rare",
      apply: s => { s.crit = Math.min(0.75, s.crit + 0.08); }
    },
    {
      icon: "🧃", name: "瓜汁吸血", desc: "每次攻击回复 +2 HP", rarity: "rare",
      apply: s => { s.lifesteal += 2; }
    },
    {
      icon: "🛡️", name: "瓜皮护盾", desc: "每层开始获得 +5 护盾", rarity: "common",
      apply: s => { s.shieldPerFloor += 5; }
    },
    {
      icon: "🌿", name: "连击藤蔓", desc: "连击率 +15%，追加 50% 伤害", rarity: "rare",
      apply: s => { s.comboRate = Math.min(0.6, s.comboRate + 0.15); }
    },
    {
      icon: "🍉", name: "西瓜丰收", desc: "每层通关额外 +3 西瓜", rarity: "common",
      apply: s => { s.watermelonBonus += 3; }
    },
    {
      icon: "🌱", name: "西瓜之力", desc: "每 10 个西瓜提供 +1 攻击，可叠加", rarity: "epic",
      apply: s => { s.watermelonPower += 1; }
    },
    {
      icon: "🍹", name: "急救瓜汁", desc: "立即回复 30 HP", rarity: "common",
      apply: s => {
        s.hp = Math.min(s.maxHp, s.hp + 30);
      }
    },
    {
      icon: "🌵", name: "荆棘瓜皮", desc: "受击时反弹 +2 伤害", rarity: "rare",
      apply: s => { s.thorns += 2; }
    }
  ];

  function showRewards() {
    const pool = [...rewardPool];

    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    const choices = pool.slice(0, 2);
    const container = el("rewardCards");
    container.innerHTML = "";

    choices.forEach(reward => {
      const card = document.createElement("button");
      card.className = "reward-card";
      card.innerHTML = `
        <span class="rarity ${reward.rarity}">${reward.rarity === "epic" ? "EPIC" : reward.rarity === "rare" ? "RARE" : "COMMON"}</span>
        <div class="reward-icon">${reward.icon}</div>
        <div class="reward-name">${reward.name}</div>
        <div class="reward-desc">${reward.desc}</div>
      `;
      card.onclick = () => chooseReward(reward);
      container.appendChild(card);
    });

    el("rewardModal").classList.remove("hidden");
  }

  function chooseReward(reward) {
    ensureAudio();
    reward.apply(state);
    sfx.pick();

    el("rewardModal").classList.add("hidden");
    log(`选择奖励：${reward.icon} ${reward.name}`, "win");

    state.floor += 1;
    state.busy = false;
    spawnEnemy();

    const newEnemy = state.enemy;
    log(`进入第 ${state.floor} 层${newEnemy.isBoss ? " —— 👑 Boss 出现！" : newEnemy.name.includes("精英") ? " —— ⚠️ 精英敌人！" : ""}`, newEnemy.isBoss ? "crit" : "info");
  }

  // ---------- 结束 / 重开 ----------
  function gameOver() {
    sfx.lose();

    const isRecord = updateBest();
    renderBest();

    el("gameOverText").textContent =
      `你到达了第 ${state.floor} 层，收集了 ${state.watermelon} 个西瓜。`;

    const recordLine = el("recordLine");
    if (isRecord && state.floor > 1) {
      recordLine.textContent = `🏆 新纪录！历史最佳：第 ${state.floor} 层`;
      recordLine.classList.remove("hidden");
    } else {
      recordLine.classList.add("hidden");
    }

    el("gameOverModal").classList.remove("hidden");
  }

  function restart() {
    Object.assign(state, {
      floor: 1,
      watermelon: 0,
      hp: 100,
      maxHp: 100,
      atk: 10,
      shield: 0,
      crit: 0.05,
      lifesteal: 0,
      comboRate: 0,
      thorns: 0,
      shieldPerFloor: 0,
      watermelonBonus: 0,
      watermelonPower: 0,
      enemy: null,
      busy: false,
      alive: true
    });

    el("log").innerHTML = "";
    el("gameOverModal").classList.add("hidden");
    el("rewardModal").classList.add("hidden");

    log("新的冒险开始：收集西瓜，杀穿地下城！", "info");
    spawnEnemy();
  }

  el("attackBtn").addEventListener("click", playerAttack);
  el("restartBtn").addEventListener("click", restart);

  // 空格 / 回车快捷攻击
  document.addEventListener("keydown", e => {
    if ((e.code === "Space" || e.code === "Enter") && !e.repeat) {
      e.preventDefault();
      if (el("attackBtn").disabled) return;
      playerAttack();
    }
  });

  log("新的冒险开始：收集西瓜，杀穿地下城！", "info");
  spawnEnemy();
</script>

</body>
</html>
